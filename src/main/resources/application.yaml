spring:
  application:
    name: transaction-velocity
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      connect-timeout: 2s
      timeout: 2s
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis
      show-details: never
  health:
    redis:
      enabled: true

app:
  velocity:
    window-seconds: ${VELOCITY_WINDOW_SECONDS:60}
    max-transactions: ${VELOCITY_MAX_TRANSACTIONS:5}
  security:
    api-key: ${APP_API_KEY}
